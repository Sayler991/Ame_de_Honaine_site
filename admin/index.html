<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Espace gérant — L'Âme de Honaine</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png">
  <link rel="stylesheet" href="admin.css?v=11">
</head>
<body>
  <div id="login" hidden>
    <form class="card login" id="login-form">
      <img src="../images/logo.png" alt="L'Âme de Honaine" width="72" height="72">
      <h1>Espace gérant</h1>
      <p class="mut">Modifiez la carte, les prix, les horaires, le téléphone et les photos du site.</p>
      <label>E-mail<input id="em" type="email" autocomplete="username" required></label>
      <label>Mot de passe<input id="pw" type="password" autocomplete="current-password" required></label>
      <p class="err" id="login-err" hidden></p>
      <button class="btn" type="submit">Se connecter</button>
    </form>
  </div>
  <div id="app" hidden></div>
  <div id="boot">Chargement…</div>
  <div id="toasts"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
  <script src="../config.js?v=11"></script>
  <script src="admin.js?v=11"></script>
</body>
</html>
